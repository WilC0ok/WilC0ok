<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cold War command room</title>
  <desc id="desc">A stylized emergency command room overlooking a glowing strategic map of Europe.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#1c2637"/>
      <stop offset="1" stop-color="#351b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="63%" r="48%">
      <stop offset="0" stop-color="#f0b84f" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#d34c3f" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10131a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <rect width="1200" height="720" fill="url(#glow)"/>
  <path d="M0 430 L1200 300 L1200 720 L0 720 Z" fill="#0b1018" opacity="0.86"/>
  <path d="M140 490 C270 426 430 420 560 470 C700 525 820 468 1000 426" fill="none" stroke="#5b8fd9" stroke-width="5" opacity="0.65"/>
  <path d="M190 555 C380 485 470 570 620 525 C760 484 850 530 1032 470" fill="none" stroke="#d34c3f" stroke-width="5" opacity="0.62"/>
  <g opacity="0.9">
    <ellipse cx="610" cy="570" rx="330" ry="72" fill="#182132" stroke="#f0b84f" stroke-opacity="0.45" stroke-width="4"/>
    <ellipse cx="610" cy="570" rx="280" ry="48" fill="none" stroke="#5b8fd9" stroke-opacity="0.25" stroke-width="3"/>
    <path d="M335 566 H885" stroke="#f0b84f" stroke-opacity="0.32"/>
    <path d="M610 500 V640" stroke="#f0b84f" stroke-opacity="0.32"/>
  </g>
  <g filter="url(#blur)" opacity="0.45">
    <circle cx="770" cy="420" r="30" fill="#d34c3f"/>
    <circle cx="520" cy="462" r="22" fill="#f0b84f"/>
    <circle cx="920" cy="502" r="18" fill="#5b8fd9"/>
  </g>
  <g fill="#10131a" stroke="#38445a" stroke-width="3">
    <rect x="115" y="180" width="190" height="115" rx="12"/>
    <rect x="895" y="150" width="205" height="126" rx="12"/>
    <rect x="435" y="120" width="330" height="165" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#f2f5f9">
    <text x="468" y="178" font-size="28">DEFCON</text>
    <text x="468" y="224" font-size="54" fill="#d34c3f">3</text>
    <text x="146" y="232" font-size="24" fill="#5b8fd9">NATO LINK</text>
    <text x="930" y="212" font-size="24" fill="#f0b84f">EUROPE</text>
  </g>
</svg>
